
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | VELORA</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f3ed;
            text-align: center;
        }

        .success-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 45px 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
        }

        .success-icon {
            font-size: 65px;
            color: #56845b;
        }

        h1 {
            color: #654b3c;
        }

        p {
            color: #666;
            line-height: 1.7;
        }

        .home-button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #654b3c;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="success-container">
        <div class="success-icon">✓</div>
        <h1>Order Placed Successfully!</h1>
        <p>Thank you for shopping with VELORA.</p>
        <p>Your order has been confirmed.</p>
        <div id="order-details">
    <p id="order-id"></p>
    <h3 id="order-total"></h3>
</div>
        <h2>We hope to see you again!</h2>

        <a href="index.html" class="home-button">
            Continue Shopping
        </a>
    </div>
    <script>
    const orders = JSON.parse(
        localStorage.getItem("veloraOrders")
    ) || [];

    const latestOrder = orders[orders.length - 1];

    if (latestOrder) {
        document.getElementById("order-id").textContent =
            "Order ID: " + latestOrder.id;

        document.getElementById("order-total").textContent =
            "Total Paid: ₹" + latestOrder.total;
    }
</script>

</body>
</html>
